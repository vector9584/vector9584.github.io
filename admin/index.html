<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mocha - 博客后台管理</title>
  <link rel="stylesheet" href="https://fonts.font.im/css?family=Noto+Sans+SC:400,500,700&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }

    /* 背景动画 */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .bg-animation::before,
    .bg-animation::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: float 10s ease-in-out infinite;
    }

    .bg-animation::before {
      background: rgba(255, 255, 255, 0.3);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .bg-animation::after {
      background: rgba(255, 255, 255, 0.2);
      bottom: -100px;
      right: -100px;
      animation-delay: 5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 50px) scale(1.2); }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #999;
      font-size: 14px;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: 10px;
      left: 15px;
      font-size: 12px;
      color: #667eea;
      background: white;
      padding: 0 5px;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group input::placeholder {
      color: transparent;
    }

    .captcha-group {
      display: flex;
      gap: 10px;
    }

    .captcha-group .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .captcha-canvas {
      width: 120px;
      height: 46px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .captcha-canvas:hover {
      border-color: #667eea;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      color: #e74c3c;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .error-message.show {
      opacity: 1;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 12px;
    }

    /* 响应式设计 */
    @media (max-width: 480px) {
      .login-container {
        margin: 20px;
        padding: 30px;
      }

      .login-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-animation"></div>
  
  <div class="login-container">
    <div class="login-header">
      <h1>Mocha 博客后台</h1>
      <p>欢迎回来，请登录管理您的博客</p>
    </div>

    <form id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <input type="text" id="username" required placeholder="用户名">
        <label for="username">用户名</label>
      </div>

      <div class="form-group">
        <input type="password" id="password" required placeholder="密码">
        <label for="password">密码</label>
      </div>

      <div class="captcha-group">
        <div class="form-group">
          <input type="text" id="captcha" required placeholder="验证码">
          <label for="captcha">验证码</label>
        </div>
        <canvas class="captcha-canvas" id="captchaCanvas" width="120" height="46"></canvas>
      </div>

      <button type="button" class="login-btn" id="loginBtn">登 录</button>
      
      <div class="error-message" id="errorMsg">内容错误，请重新填写!</div>
    </form>

    <div class="footer-text">
      Powered by Hexo & NexT
    </div>
  </div>

  <script>
    // 验证码相关
    const chars = 'ABCDEFGHJKMNPQRSTWXYZabcdefhijkmnprstwxyz2345678';
    
    function randomString(len = 4) {
      let result = '';
      const maxPos = chars.length;
      for (let i = 0; i < len; i++) {
        result += chars.charAt(Math.floor(Math.random() * maxPos));
      }
      return result;
    }

    function randomColor() {
      const r = Math.floor(Math.random() * 100 + 50);
      const g = Math.floor(Math.random() * 100 + 50);
      const b = Math.floor(Math.random() * 100 + 50);
      return `rgb(${r}, ${g}, ${b})`;
    }

    let captchaCode = '';
    const captchaCanvas = document.getElementById('captchaCanvas');
    const ctx = captchaCanvas.getContext('2d');

    function drawCaptcha() {
      captchaCode = randomString();
      const width = captchaCanvas.width;
      const height = captchaCanvas.height;

      // 清空画布
      ctx.clearRect(0, 0, width, height);

      // 绘制背景
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, 0, width, height);

      // 绘制干扰线
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = randomColor();
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(Math.random() * width, Math.random() * height);
        ctx.lineTo(Math.random() * width, Math.random() * height);
        ctx.stroke();
      }

      // 绘制干扰点
      for (let i = 0; i < 20; i++) {
        ctx.fillStyle = randomColor();
        ctx.beginPath();
        ctx.arc(Math.random() * width, Math.random() * height, 1, 0, Math.PI * 2);
        ctx.fill();
      }

      // 绘制验证码文字
      ctx.font = 'bold 24px Arial';
      const codeWidth = captchaCode.length * 24;
      const startX = (width - codeWidth) / 2 + 10;
      
      for (let i = 0; i < captchaCode.length; i++) {
        ctx.fillStyle = randomColor();
        ctx.save();
        ctx.translate(startX + i * 26, height / 2 + 8);
        ctx.rotate((Math.random() - 0.5) * 0.3);
        ctx.fillText(captchaCode[i], 0, 0);
        ctx.restore();
      }
    }

    // 点击刷新验证码
    captchaCanvas.addEventListener('click', drawCaptcha);
    drawCaptcha();

    // 登录逻辑
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const captchaInput = document.getElementById('captcha');
    const errorMsg = document.getElementById('errorMsg');

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
      setTimeout(() => {
        errorMsg.classList.remove('show');
      }, 3000);
    }

    loginBtn.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      const captcha = captchaInput.value.trim().toUpperCase();

      if (!username || !password || !captcha) {
        showError('请填写完整的登录信息');
        return;
      }

      if (captcha !== captchaCode) {
        showError('验证码错误，请重新输入');
        drawCaptcha();
        captchaInput.value = '';
        return;
      }

      // 验证用户名和密码
      if (username === 'vector' && password === 'qingnanzikong') {
        // 获取当前域名和端口，跳转到对应的 admin 路径
        const currentOrigin = window.location.origin;
        window.location.href = currentOrigin + '/admin';
      } else {
        showError('用户名或密码错误');
        drawCaptcha();
        captchaInput.value = '';
      }
    });

    // 回车键提交
    document.body.addEventListener('keyup', (e) => {
      if (e.keyCode === 13) {
        loginBtn.click();
      }
    });
  </script>
</body>

</html>
